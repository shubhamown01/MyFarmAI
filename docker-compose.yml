services:
  postgres:
    image: postgres:17
    container_name: myfarmai-postgres
    environment:
      POSTGRES_DB: myfarmai
      POSTGRES_USER: myfarmai
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - myfarmai-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myfarmai -d myfarmai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: myfarmai-backend
    # Run as the host user that owns ./.env, ./backend/.pg_password and
    # ./backend/data (bind mounts keep host ownership). Non-root (not 0).
    user: "${MYFARMAI_UID:-1000}:${MYFARMAI_GID:-1000}"
    environment:
      DATABASE_PATH: postgresql://myfarmai@postgres:5432/myfarmai
      DATABASE_PASSWORD_FILE: /run/secrets/pg_password
      # Host Ollama binds 127.0.0.1 only; scripts/ollama-bridge.sh forwards the
      # docker0 gateway IP -> host loopback. host.docker.internal (extra_hosts
      # host-gateway below) is stable across compose-network recreation.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # Dev OTP outbox on the bind-mounted data volume → readable on the host
      # at backend/data/dev_otp_outbox.txt (email_delivery_mode=dev sends NO
      # real email until the owner configures a provider — blocker B2).
      OTP_OUTBOX_PATH: /app/data/dev_otp_outbox.txt
    # Owner credentials (OAuth client secrets, SMTP) live in the git-ignored
    # backend/.env. environment: values still take precedence over this file.
    # required:false keeps `docker compose config` valid in CI, where the
    # secret file intentionally does not exist; local/dev runs still bring it.
    env_file:
      - path: ./backend/.env
        required: false
    # Loopback-only host exposure for the local web dev server (proxy target).
    # Never publish beyond 127.0.0.1 until the Phase 6/9 deployment gates pass.
    ports:
      - "127.0.0.1:8000:8000"
    # Bridge to the host loopback so the container can reach host-run Ollama.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - pg_password
    volumes:
      - ./backend/data:/app/data
    networks:
      - myfarmai-internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  myfarmai-internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local

secrets:
  pg_password:
    file: ./backend/.pg_password