<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-label="Smart farming: a farmer using a smartphone in a field to access agricultural information">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="60%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BBF7D0"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="750" fill="url(#sky)"/>
  <circle cx="200" cy="120" r="48" fill="#F59E0B" opacity="0.9"/>
  <circle cx="200" cy="120" r="70" fill="#F59E0B" opacity="0.15"/>
  <!-- Field -->
  <path d="M0,600 Q250,560 600,600 Q950,660 1000,600 V750 H0 Z" fill="url(#field)"/>
  <!-- Crop rows -->
  <g stroke="#14532D" stroke-width="2" opacity="0.35">
    <path d="M0,630 Q200,690 500,690 T900,690 T1000,690"/>
    <path d="M0,670 Q200,730 500,730 T900,730 T1000,730"/>
    <path d="M0,710 Q200,740 500,740 T900,740 T1000,740"/>
  </g>
  <!-- Farmer figure -->
  <g id="farmer">
    <!-- hat -->
    <path d="M340,540 Q340,525 360,520 Q380,515 380,525 Q380,540 360,545 Z" fill="#3E2723"/>
    <circle cx="370" cy="535" r="15" fill="#D2A679"/>
    <!-- body (shirt) -->
    <path d="M354,550 L354,620 L386,620 L386,550 Z" fill="#B08D57"/>
    <path d="M360,556 L360,600 L380,600 L380,556 Z" fill="#92400E" opacity="0.6"/>
    <!-- arms -->
    <path d="M354,570 Q310,575 300,590 Q295,600 305,595 L340,590 Z" fill="#B08D57"/>
    <path d="M386,570 Q430,575 440,590 Q445,600 435,595 L400,590 Z" fill="#B08D57"/>
    <!-- legs -->
    <rect x="360" y="620" width="12" height="42" fill="#5D4037"/>
    <rect x="378" y="620" width="12" height="42" fill="#5D4037"/>
    <!-- hand holding phone -->
    <path d="M430,592 Q450,595 460,610 Q455,620 445,615 L425,610 Z" fill="#B08D57"/>
  </g>
  <!-- Smartphone with app UI -->
  <g>
    <rect x="440" y="490" width="78" height="150" rx="14" fill="url(#phone)" stroke="#374151" stroke-width="4"/>
    <rect x="448" y="498" width="62" height="134" rx="10" fill="#14532D"/>
    <!-- screen content -->
    <rect x="456" y="506" width="46" height="46" rx="8" fill="#F8FAF5"/>
    <rect x="456" y="562" width="46" height="46" rx="8" fill="#F8FAF5"/>
    <rect x="512" y="506" width="46" height="46" rx="8" fill="#F8FAF5"/>
    <rect x="512" y="562" width="46" height="46" rx="8" fill="#F8FAF5"/>
    <!-- header text lines -->
    <rect x="458" y="520" width="20" height="4" rx="2" fill="#D1FAE5"/>
    <rect x="484" y="520" width="30" height="4" rx="2" fill="#D1FAE5"/>
    <rect x="458" y="528" width="40" height="4" rx="2" fill="#D1FAE5"/>
    <!-- leaf icon on screen -->
    <path d="M486,548 Q492,540 498,548 Q504,540 510,548 Q504,556 498,548 Q492,556 486,548 Z" fill="#86EFAC"/>
  </g>
  <!-- Speech/info bubbles from phone -->
  <g fill="#FFFFFF" stroke="#14532D" stroke-width="2" opacity="0.95">
    <path d="M530,450 Q550,420 590,430 Q630,440 640,470 Q630,500 590,490 Q550,480 530,450 Z"/>
    <path d="M560,460 Q580,445 600,455 Q620,465 610,485 Q590,495 570,485 Q560,470 560,460 Z" fill="#F8FAF5"/>
    <circle cx="580" cy="470" r="6" fill="#14532D"/>
    <circle cx="600" cy="460" r="4" fill="#F59E0B"/>
  </g>
  <g fill="#FFFFFF" stroke="#14532D" stroke-width="2" opacity="0.9">
    <path d="M490,430 Q510,400 550,410 Q590,420 600,450 Q590,480 550,470 Q510,460 490,430 Z"/>
    <path d="M520,440 Q540,425 560,435 Q580,445 570,465 Q550,475 530,465 Q520,450 520,440 Z" fill="#F8FAF5"/>
    <circle cx="540" cy="450" r="5" fill="#14532D"/>
    <circle cx="560" cy="440" r="3" fill="#F59E0B"/>
  </g>
  <!-- foreground grass -->
  <g fill="#14532D" opacity="0.9">
    <path d="M60,750 Q70,710 80,750 Z"/><path d="M120,745 Q130,705 140,745 Z"/>
    <path d="M920,755 Q930,715 940,755 Z"/><path d="M980,748 Q990,708 1000,748 Z"/>
  </g>
</svg>
