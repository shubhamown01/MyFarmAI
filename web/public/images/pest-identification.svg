<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-label="Pest identification: detailed macro photography of common agricultural pests on crops">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAF5"/>
      <stop offset="100%" stop-color="#E7F0E7"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="750" fill="url(#bg)"/>
  <circle cx="920" cy="120" r="80" fill="#FEF3C7" opacity="0.5"/>
  <circle cx="90" cy="640" r="90" fill="#D1FAE5" opacity="0.45"/>
  <!-- Stem -->
  <path d="M420,750 Q440,560 460,420 Q480,340 470,260" stroke="#5D4037" stroke-width="26" fill="none" stroke-linecap="round"/>
  <path d="M440,720 Q450,600 470,480 Q480,380 470,300" stroke="#8D6E63" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- Leaf -->
  <path d="M300,380 Q420,240 600,320 Q780,400 620,620 Q420,700 300,520 Q180,440 300,380" fill="url(#leaf)" stroke="#14532D" stroke-width="5"/>
  <path d="M420,300 Q560,260 620,420 Q480,480 420,300 Z" fill="#86EFAC" opacity="0.6"/>
  <path d="M450,340 Q520,320 570,370 Q530,410 480,400" stroke="#14532D" stroke-width="3" fill="none" opacity="0.6"/>
  <!-- Aphid cluster (small pear-shaped insects) -->
  <g fill="#B45309">
    <ellipse cx="540" cy="390" rx="14" ry="22" transform="rotate(-20 540 390)"/>
    <ellipse cx="560" cy="410" rx="12" ry="20" transform="rotate(-15 560 410)"/>
    <ellipse cx="520" cy="425" rx="13" ry="21" transform="rotate(-25 520 425)"/>
    <ellipse cx="580" cy="430" rx="11" ry="19" transform="rotate(-10 580 430)"/>
    <ellipse cx="505" cy="370" rx="10" ry="17" transform="rotate(-30 505 370)"/>
  </g>
  <g fill="#374151">
    <circle cx="540" cy="385" r="3"/><circle cx="560" cy="405" r="3"/>
    <circle cx="520" cy="420" r="3"/><circle cx="580" cy="425" r="3"/>
    <circle cx="505" cy="365" r="3"/>
  </g>
  <!-- Caterpillar / larva on leaf edge -->
  <g>
    <path d="M660,520 Q700,540 740,510 Q780,530 820,500 Q860,520 900,490" stroke="#CA8A04" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M670,525 Q705,545 745,515 Q785,535 825,505 Q865,525 905,495" stroke="#B45309" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- segments -->
    <g stroke="#9A3412" stroke-width="3">
      <line x1="690" y1="532" x2="710" y2="532"/><line x1="740" y1="520" x2="760" y2="520"/>
      <line x1="790" y1="535" x2="810" y2="535"/><line x1="840" y1="518" x2="860" y2="518"/>
    </g>
    <!-- head -->
    <circle cx="905" cy="488" r="11" fill="#451A03"/>
    <circle cx="898" cy="484" r="3" fill="#F8FAF5"/>
  </g>
  <!-- Beetle on stem -->
  <g>
    <ellipse cx="470" cy="330" rx="22" ry="14" fill="#1E293B" transform="rotate(10 470 330)"/>
    <ellipse cx="470" cy="330" rx="18" ry="10" fill="#374151" transform="rotate(10 470 330)"/>
    <circle cx="492" cy="324" r="5" fill="#1E293B"/>
    <circle cx="496" cy="321" r="2" fill="#F8FAF5"/>
    <path d="M460,326 Q470,320 480,326" stroke="#F8FAF5" stroke-width="2" fill="none" opacity="0.6"/>
  </g>
  <!-- Magnified callout circles -->
  <g stroke="#14532D" stroke-width="3" fill="none">
    <circle cx="540" cy="390" r="40" opacity="0.5"/>
    <circle cx="780" cy="505" r="40" opacity="0.5"/>
    <circle cx="470" cy="330" r="30" opacity="0.5"/>
  </g>
  <text x="540" y="340" fill="#14532D" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Aphids</text>
  <text x="780" y="455" fill="#14532D" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Larva</text>
  <text x="470" y="295" fill="#14532D" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Beetle</text>
</svg>
