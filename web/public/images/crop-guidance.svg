<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-label="Crop guidance: close-up photography of healthy crop growth and agricultural practices">
  <defs>
    <radialGradient id="leafGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#BBF7D0"/>
      <stop offset="55%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAF5"/>
      <stop offset="100%" stop-color="#E7F0E7"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="750" fill="url(#bg)"/>
  <!-- Soft background bokeh -->
  <circle cx="880" cy="120" r="90" fill="#D1FAE5" opacity="0.5"/>
  <circle cx="120" cy="620" r="110" fill="#BBF7D0" opacity="0.45"/>
  <circle cx="500" cy="700" r="130" fill="#D1FAE5" opacity="0.4"/>
  <!-- Main healthy leaf (center) -->
  <path d="M250,380 Q350,120 520,250 Q690,380 560,620 Q380,740 250,600 Q120,460 250,380" fill="url(#leafGrad)" stroke="#14532D" stroke-width="4"/>
  <path d="M380,300 Q520,240 560,420 Q380,480 380,300 Z" fill="#86EFAC" opacity="0.7"/>
  <!-- veins -->
  <path d="M410,330 Q470,300 530,340 Q490,380 440,410" stroke="#14532D" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M470,360 Q510,330 550,380 Q510,430 460,460" stroke="#14532D" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M390,420 Q430,390 480,430 Q450,470 400,500" stroke="#14532D" stroke-width="3" fill="none" opacity="0.7"/>
  <!-- Secondary leaf -->
  <path d="M600,460 Q720,300 820,420 Q700,560 560,500 Q430,440 600,460" fill="#4ADE80" stroke="#14532D" stroke-width="3" opacity="0.85"/>
  <path d="M660,480 Q720,450 760,490 Q700,520 660,480 Z" fill="#86EFAC" opacity="0.6"/>
  <!-- Small sprouting leaf bottom-left -->
  <path d="M150,620 Q200,480 280,560 Q200,640 150,620" fill="#86EFAC" stroke="#14532D" stroke-width="3" opacity="0.9"/>
  <path d="M210,560 Q240,540 270,560 Q240,580 210,560 Z" fill="#BBF7D0" opacity="0.7"/>
  <!-- Water droplets -->
  <g fill="#E0F2FE" stroke="#2563EB" stroke-width="1.5">
    <circle cx="470" cy="320" r="7"/><circle cx="485" cy="345" r="5"/>
    <circle cx="520" cy="480" r="6"/><circle cx="535" cy="505" r="4"/>
    <circle cx="240" cy="590" r="5"/><circle cx="260" cy="610" r="4"/>
    <circle cx="730" cy="470" r="5"/>
  </g>
  <!-- Sunlight glints -->
  <circle cx="430" cy="280" r="12" fill="#FEF3C7" opacity="0.8"/>
  <circle cx="780" cy="400" r="10" fill="#FEF3C7" opacity="0.7"/>
  <!-- Small farming hand/tool hint (trowel) bottom right -->
  <path d="M800,640 L840,620 L850,660 L810,680 Z" fill="#713F12" opacity="0.85"/>
  <rect x="845" y="640" width="14" height="30" rx="3" fill="#5D4037"/>
</svg>
