name: Release

# Tag-triggered release pipeline: validates version consistency, builds the
# release APK, verifies the signature, generates checksums, and prepares a
# DRAFT GitHub Release. Publication always stays a manual, owner-approved
# step (no auto-publish of production releases).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  checks: read

jobs:
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: VERSION file matches tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          FILE=$(tr -d ' \n' < VERSION)
          echo "tag=$TAG version=$FILE"
          test "$TAG" = "$FILE" || { echo "VERSION file does not match tag"; ls; exit 1; }
      - name: Android manifest matches tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          EXP=$(node -e "console.log(require('./android/app.json').expo.version)")
          echo "tag=$TAG expo.version=$EXP"
          test "$EXP" = "$TAG"
          # NOTE: versionName/versionCode live in the generated, gitignored
          # android/android/ tree (expo prebuild output). They are verified
          # on the owner machine at sign time via apksigner/outputs; CI
          # cannot read untracked files.
      - name: Web manifest matches tag
        run: test "$(node -e "console.log(require('./web/package.json').version)")" = "${GITHUB_REF_NAME#v}"
      - name: Backend manifest matches tag
        run: test "$(grep -oP '^version = "\K[^"]+' backend/pyproject.toml)" = "${GITHUB_REF_NAME#v}"

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with: { python-version: "3.12" }
      - name: Lint + tests
        working-directory: backend
        run: |
          uv sync
          uv run ruff format --check .
          uv run ruff check app tests --exclude app/orchestrator
          uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Typecheck + test + lint + build
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test -- --runInBand --ci
          npm run lint
          npm run build

  android-build:
    runs-on: ubuntu-latest
    needs: [version-consistency, backend, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20, cache: npm, cache-dependency-path: android/package-lock.json }
      - name: Install JS deps
        working-directory: android
        run: npm ci
      - name: Bundle release JS
        working-directory: android/android
        run: ./gradlew :app:bundleReleaseJsAndAssets
      # NOTE: production signing happens on the owner machine with the
      # protected keystore (docs/release/ANDROID_SIGNING_AND_KEY_RECOVERY.md).
      # CI produces the UNSIGNED release artifact + checksum of the unsigned
      # bundle; the owner machine signs, verifies certs, and uploads assets.
      - name: Assemble unsigned release
        working-directory: android/android
        run: ./gradlew :app:assembleRelease
      - name: Stage artifacts
        run: |
          mkdir -p /tmp/assets
          cp android/android/app/build/outputs/apk/release/app-release.apk /tmp/assets/
          sha256sum /tmp/assets/app-release.apk > /tmp/assets/app-release.apk.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: /tmp/assets/*
          if-no-files-found: error
