line-length = 100
target-version = "py312"
src = ["app"]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument
    "SIM117", # merge with block
]

[lint.per-file-ignores]
"tests/*" = ["S101", "T201"]
"app/db/init_db.py" = ["T201"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[lint.isort]
known-first-party = ["app"]