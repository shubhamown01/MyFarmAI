[project]
name = "myfarmai-backend"
version = "1.0.0"
description = "MyFarmAI Backend API"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.34.0",
    "httpx==0.28.1",
    "pydantic-settings==2.9.0",
    "aiosqlite==0.20.0",
    "sqlalchemy==2.0.36",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "psycopg[binary]==3.2.5",
    "psycopg-pool==3.2.2",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "python-multipart>=0.0.32",
    "pyjwt[crypto]>=2.15.1",
    "pillow>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.3",
    "pytest-cov==6.0.0",
    "ruff==0.9.0",
    "mypy==1.14.0",
]
postgres = [
    "psycopg[binary]==3.2.5",
    "psycopg-pool==3.2.2",
]

[tool.uv]
dev-dependencies = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.3",
    "pytest-cov==6.0.0",
    "ruff==0.9.0",
    "mypy==1.14.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "B", "C4", "DTZ", "T10", "T20", "PT", "Q", "SIM", "PTH", "ERA", "PL", "TRY", "NPY", "PERF", "RSE", "RET", "SLF", "SLOT", "TCH", "ARG", "ASYNC", "LOG", "PD"]
ignore = ["ANN101", "ANN102", "ANN201", "ANN202", "ANN401", "S101", "SLF001", "TRY003", "PTH118"]
fixable = ["E", "F", "I", "UP", "W", "C90", "ANN", "B", "C4", "DTZ", "T10", "T20", "PT", "Q", "SIM", "PTH", "ERA", "PL", "TRY", "NPY", "PERF", "RSE", "RET", "SLF", "SLOT", "TCH", "ARG", "ASYNC", "LOG", "PD"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.db.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.services.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.api.*"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
