[project]
name = "myfarmai-backend"
version = "0.1.0"
description = "MyFarmAI Backend API"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.34.0",
    "httpx==0.28.1",
    "pydantic-settings==2.9.0",
    "aiosqlite==0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.3",
    "pytest-cov==6.0.0",
    "ruff==0.9.0",
    "mypy==1.14.0",
]

[tool.uv]
dev-dependencies = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.3",
    "pytest-cov==6.0.0",
    "ruff==0.9.0",
    "mypy==1.14.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "B", "C4", "DTZ", "T10", "T20", "PT", "Q", "SIM", "PTH", "ERA", "PL", "TRY", "NPY", "PERF", "RSE", "RET", "SLF", "SLOT", "TCH", "ARG", "ASYNC", "LOG", "PD"]
ignore = ["ANN101", "ANN102", "ANN201", "ANN202", "ANN401", "S101", "SLF001", "TRY003", "PTH118"]
fixable = ["E", "F", "I", "UP", "W", "C90", "ANN", "B", "C4", "DTZ", "T10", "T20", "PT", "Q", "SIM", "PTH", "ERA", "PL", "TRY", "NPY", "PERF", "RSE", "RET", "SLF", "SLOT", "TCH", "ARG", "ASYNC", "LOG", "PD"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "pytest",
    "pytest_asyncio",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]